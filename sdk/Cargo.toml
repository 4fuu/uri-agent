[package]
name = "uri-agent-plugin-sdk"
version = "2026.826.0"
edition = "2021"
license = "MIT"
description = "Rust guest SDK for URI Agent Extism WebAssembly protocol plugins"
repository = "https://github.com/4fuu/uri-agent"
readme = "README.md"
keywords = ["agent", "extism", "plugin", "wasm"]
categories = ["api-bindings", "wasm"]
include = ["src/**", "Cargo.lock", "LICENSE", "README.md"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_family = "wasm")'.dependencies]
extism-pdk = "1.4"
