[package]
name = "uri-agent"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A protocol-oriented coding agent with a focused terminal interface"
repository = "https://github.com/4fuu/uri-agent"
readme = "README.md"

[dependencies]
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
crossterm = { version = "0.29", features = ["event-stream"] }
dirs = "6"
futures-util = "0.3"
getrandom = "0.2"
http = "1"
portable-pty = "0.9"
pulldown-cmark = { version = "0.10", default-features = false }
ratatui = { version = "0.30", features = ["crossterm_0_29"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
rig = { package = "rig-core", git = "https://github.com/0xPlaygrounds/rig", rev = "abe338a" }
rhai = { version = "1", features = ["sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
shell-words = "1"
textwrap = "0.16"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tokio-rusqlite = { version = "0.7", features = ["bundled"] }
tui-term = "0.3"
tui-textarea = { package = "tui-textarea-2", version = "0.9" }
unicode-segmentation = "1"
unicode-width = "0.2"
uuid = { version = "1", features = ["serde", "v7"] }
vt100 = "0.16"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[lints.rust]
# aws-lc-sys (pulled in by reqwest's rustls feature) marks its jitterentropy
# symbols dllexport on Windows, so MSVC link.exe prints a localized
# "Creating library" notice when linking the binary. The output is benign.
linker_messages = "allow"

[profile.release]
lto = "thin"
strip = true
