name: Release

on:
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TARGET_DIR: ${{ github.workspace }}/target
  CARGO_TERM_COLOR: always

jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out source and tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt, clippy
      - name: Validate release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || {
            echo "Run releases from main, not $GITHUB_REF" >&2
            exit 1
          }
          mapfile -t versions < <(
            cargo metadata --locked --no-deps --format-version 1 |
              jq -r '.packages[] | select(.name == "uri-agent" or .name == "uri-agent-plugin-sdk") | .version'
          )
          [[ ${#versions[@]} -eq 2 && "${versions[0]}" == "${versions[1]}" ]] || {
            echo "uri-agent and uri-agent-plugin-sdk must have one shared version" >&2
            exit 1
          }
          VERSION=${versions[0]}
          [[ "$VERSION" =~ ^[0-9]{4}\.[0-9]{3,4}\.[0-9]+$ ]] || {
            echo "Version must use YYYY.MDD.REVISION" >&2
            exit 1
          }
          EXPECTED_PREFIX=$(TZ=Asia/Hong_Kong date '+%Y.%-m%d')
          [[ "$VERSION" == "$EXPECTED_PREFIX".* ]] || {
            echo "Version $VERSION does not match today's Asia/Hong_Kong date $EXPECTED_PREFIX" >&2
            exit 1
          }
          if tag_sha=$(git rev-list -n 1 "v$VERSION" 2>/dev/null); then
            [[ "$tag_sha" == "$GITHUB_SHA" ]] || {
              echo "Tag v$VERSION points to $tag_sha instead of $GITHUB_SHA" >&2
              exit 1
            }
            echo "Resuming release v$VERSION"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  verify:
    needs: validate
    runs-on: ubuntu-24.04
    env:
      ZVEC_LIB_DIR: /tmp/retrieval-assets
      LD_LIBRARY_PATH: /tmp/retrieval-assets
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt, clippy
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: checks
      - name: Prepare fixed retrieval assets
        run: python3 scripts/prepare-retrieval-assets.py --target x86_64-unknown-linux-gnu --output "$ZVEC_LIB_DIR"
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test
      - run: cargo check
      - name: Validate crate packages
        run: cargo package --locked --package uri-agent-plugin-sdk

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            format: tar
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            format: tar
          - runner: macos-26
            target: aarch64-apple-darwin
            format: tar
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            format: zip
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          targets: ${{ matrix.target }}
      - name: Install pinned Linux build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes patchelf python3-pip
          python3 -m pip install --break-system-packages ziglang==0.13.0
          cargo install cargo-zigbuild --version 0.20.1 --locked
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: release
          key: ${{ matrix.target }}
      - name: Prepare fixed retrieval assets
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: python3 scripts/prepare-retrieval-assets.py --target "$TARGET" --output "$RUNNER_TEMP/stage"
      - name: Exercise the fixed native retrieval stack
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        shell: bash
        env:
          URI_AGENT_TEST_RETRIEVAL_ASSETS: ${{ runner.temp }}/stage
          ZVEC_LIB_DIR: ${{ runner.temp }}/stage
          LD_LIBRARY_PATH: ${{ runner.temp }}/stage
        run: cargo test --locked --package uri-agent --lib retrieval::tests::bundled_assets_rebuild_and_search -- --ignored --exact
      - name: Build Linux binary against glibc 2.27
        if: runner.os == 'Linux'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          ZVEC_LIB_DIR: ${{ runner.temp }}/stage
        run: cargo zigbuild --locked --release --package uri-agent --target "$TARGET.2.27"
      - name: Build binary on macOS and Windows
        if: runner.os != 'Linux'
        env:
          ZVEC_LIB_DIR: ${{ runner.temp }}/stage
        run: cargo build --locked --release --package uri-agent --target ${{ matrix.target }}
      - name: Stage and verify Unix bundle
        if: matrix.format == 'tar'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/stage"
          cp "target/$TARGET/release/uri-agent" LICENSE README.md README.zh-CN.md "$STAGE/"
          if [[ "$RUNNER_OS" == Linux ]]; then
            patchelf --set-rpath '$ORIGIN' "$STAGE/uri-agent"
            patchelf --print-rpath "$STAGE/uri-agent" | grep -Fx '$ORIGIN'
            ldd "$STAGE/uri-agent" | grep -F 'libzvec_c_api.so =>'
            max_glibc=$(readelf --version-info "$STAGE/uri-agent" "$STAGE/libzvec_c_api.so" |
              grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -1)
            [[ "$(printf '%s\n' GLIBC_2.27 "$max_glibc" | sort -V | tail -1)" == GLIBC_2.27 ]]
          else
            install_name_tool -add_rpath @executable_path "$STAGE/uri-agent" 2>/dev/null || true
            otool -l "$STAGE/uri-agent" | grep -A2 LC_RPATH | grep -F '@executable_path'
            otool -L "$STAGE/uri-agent" | grep -F 'libzvec_c_api.dylib'
          fi
          "$STAGE/uri-agent" --version | grep -F "uri-agent $VERSION"
          python3 scripts/prepare-retrieval-assets.py --target "$TARGET" --output "$STAGE" --verify-only
      - name: Create Unix archive
        if: matrix.format == 'tar'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/stage"
          tar -czf "uri-agent-$VERSION-$TARGET.tar.gz" -C "$STAGE" .
      - name: Stage and verify Windows bundle
        if: matrix.format == 'zip'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          $stage = Join-Path $env:RUNNER_TEMP "stage"
          Copy-Item "target/$env:TARGET/release/uri-agent.exe", "LICENSE", "README.md", "README.zh-CN.md" -Destination $stage
          python scripts/prepare-retrieval-assets.py --target $env:TARGET --output $stage --verify-only
          Remove-Item "$stage/zvec_c_api.lib"
          $output = & "$stage/uri-agent.exe" --version
          if ($output -ne "uri-agent $env:VERSION") { throw "Unexpected version: $output" }
      - name: Create Windows archive
        if: matrix.format == 'zip'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          $stage = Join-Path $env:RUNNER_TEMP "stage"
          Compress-Archive -Path "$stage/*" -DestinationPath "uri-agent-$env:VERSION-$env:TARGET.zip"
      - name: Upload release archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: uri-agent-${{ matrix.target }}
          path: uri-agent-${{ needs.validate.outputs.version }}-${{ matrix.target }}.*
          if-no-files-found: error
          retention-days: 7

  publish-crates:
    needs: [validate, verify, build]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      id-token: write
    env:
      INITIAL_CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - name: Restore verified Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: checks
          save-if: false
      - name: Authenticate with crates.io using OIDC
        if: env.INITIAL_CARGO_REGISTRY_TOKEN == ''
        id: crates_io_auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish SDK
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ env.INITIAL_CARGO_REGISTRY_TOKEN || steps.crates_io_auth.outputs.token }}
        run: |
          set -euo pipefail
          crate_status() {
            curl --silent --output /dev/null --write-out '%{http_code}' \
              --user-agent "uri-agent-release/$VERSION (https://github.com/4fuu/uri-agent)" \
              "https://crates.io/api/v1/crates/$1/$VERSION"
          }
          publish_if_missing() {
            crate=$1
            package=$2
            status=$(crate_status "$crate")
            case $status in
              200) echo "$crate $VERSION is already published" ;;
              404) cargo publish --locked --package "$package" ;;
              *) echo "crates.io returned HTTP $status for $crate $VERSION" >&2; exit 1 ;;
            esac
          }

          publish_if_missing uri-agent-plugin-sdk uri-agent-plugin-sdk

  release:
    needs: [validate, build, publish-crates]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Download release archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: release
          merge-multiple: true
      - name: Generate checksums and package-manager metadata
        shell: bash
        run: |
          set -euo pipefail
          expected_sha=$GITHUB_SHA
          git fetch origin main
          actual_sha=$(git rev-parse origin/main)
          [[ "$actual_sha" == "$expected_sha" ]] || {
            echo "main moved from $expected_sha to $actual_sha during the release" >&2
            exit 1
          }
          (cd release && sha256sum uri-agent-* > SHA256SUMS)
          python3 scripts/update-package-metadata.py "$VERSION" release/SHA256SUMS
          jq --exit-status . bucket/uri-agent.json >/dev/null
      - name: Commit package-manager metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/uri-agent.rb bucket/uri-agent.json
          if ! git diff --cached --quiet; then
            git commit -m "release: update package metadata for v$VERSION"
            git push origin HEAD:main
          fi
          echo "release_sha=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Create GitHub release
        shell: bash
        run: |
          set -euo pipefail
          TAG="v$VERSION"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber --repo "$GITHUB_REPOSITORY"
          elif git rev-parse --verify --quiet "refs/tags/$TAG"; then
            gh release create "$TAG" release/* \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "URI Agent $VERSION" \
              --generate-notes
          else
            gh release create "$TAG" release/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$release_sha" \
              --title "URI Agent $VERSION" \
              --generate-notes
          fi

  smoke-installers:
    needs: [validate, release]
    uses: ./.github/workflows/smoke-installers.yml
    with:
      version: ${{ needs.validate.outputs.version }}
